# =============================================================================
# Host nginx vhost: qortfolio.com / www.qortfolio.com  ->  Streamlit (127.0.0.1:8501)
# Place at: /etc/nginx/sites-available/qortfolio.com.conf
# Enable:   ln -s ../sites-available/qortfolio.com.conf /etc/nginx/sites-enabled/
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name qortfolio.com www.qortfolio.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qortfolio.com www.qortfolio.com;

    include /etc/nginx/snippets/cloudflare-origin.conf;
    client_max_body_size 50M;

    access_log /var/log/nginx/qortfolio.access.log;
    error_log  /var/log/nginx/qortfolio.error.log warn;

    # Streamlit websocket (live reruns)
    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /_stcore/health {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
        access_log off;
    }

    # Main app
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
