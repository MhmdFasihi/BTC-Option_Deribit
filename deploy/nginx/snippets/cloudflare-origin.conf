# Shared SSL settings for both vhosts.
# Uses ONE Cloudflare Origin Certificate covering qortfolio.com + *.qortfolio.com.
# Create it in Cloudflare dashboard (see CLOUDFLARE.md), then paste:
#   cert -> /etc/nginx/ssl/qortfolio_origin.pem
#   key  -> /etc/nginx/ssl/qortfolio_origin.key   (chmod 600)

ssl_certificate     /etc/nginx/ssl/qortfolio_origin.pem;
ssl_certificate_key /etc/nginx/ssl/qortfolio_origin.key;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# HSTS (Cloudflare also offers this; keep one source of truth)
add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
