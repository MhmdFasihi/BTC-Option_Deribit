# =============================================================================
# Streamlit Production Configuration
# Qortfolio Bitcoin Options Analytics Platform
# =============================================================================

[global]
developmentMode = false
showWarningOnDirectExecution = false

[server]
# Server settings
port = 8501
address = "0.0.0.0"
headless = true

# Security settings
enableCORS = false
enableXsrfProtection = true

# File upload limits
maxUploadSize = 50
maxMessageSize = 200

# Performance
enableWebsocketCompression = true
runOnSave = false

[browser]
# Disable telemetry
gatherUsageStats = false

# Production domain settings
serverAddress = "qortfolio.com"
serverPort = 443

[logger]
level = "info"
messageFormat = "%(asctime)s %(levelname)s - %(message)s"

[client]
# Hide error details in production
showErrorDetails = false
toolbarMode = "minimal"

[theme]
# Qortfolio theme colors
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[runner]
magicEnabled = true
installTracer = false
fixMatplotlib = true
postScriptGC = true
fastReruns = true
